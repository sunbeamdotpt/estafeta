schema: 1
project:
  name: estafeta
  kind: rust-workspace
  description: "Estafeta — unified notification inbox service over gRPC, NATS, and PostgreSQL."
targets:
  build:
    exec: "cargo build --workspace --release"
  test:
    exec: [cargo, nextest, run, --workspace]
  lint:
    exec: "cargo clippy --workspace -- -D warnings"
  fmt:
    exec: "cargo fmt --all"
  clean:
    exec: "cargo clean"
  doc:
    exec: "cargo doc --workspace --no-deps"
  package:
    exec: "docker buildx build --push -t src.${SUNBEAM_REGISTRY}/studio/estafeta:latest ."
deps:
  services:
    - postgres
    - nats
    - hydra
    - keto
tenant:
  namespace: sunbeam-estafeta
outputs:
  - target/release/estafeta
