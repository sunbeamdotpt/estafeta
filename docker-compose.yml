services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: estafeta
      POSTGRES_USER: estafeta
      POSTGRES_PASSWORD: estafeta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estafeta"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.11
    command: ["--jetstream", "--store_dir", "/data"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    volumes:
      - natsdata:/data

  kratos:
    image: oryd/kratos:v1.3
    environment:
      DSN: postgres://estafeta:estafeta@postgres:5432/kratos?sslmode=disable
    ports:
      - "4433:4433"   # public
      - "4434:4434"   # admin
    depends_on:
      postgres:
        condition: service_healthy

  hydra:
    image: oryd/hydra:v2.3
    environment:
      DSN: postgres://estafeta:estafeta@postgres:5432/hydra?sslmode=disable
      URLS_SELF_ISSUER: http://hydra:4444
      URLS_LOGIN: http://localhost:4433/self-service/login/browser
      URLS_CONSENT: http://localhost:4433/self-service/consent
    ports:
      - "4444:4444"   # public
      - "4445:4445"   # admin
    depends_on:
      postgres:
        condition: service_healthy

  keto:
    image: oryd/keto:v0.13
    environment:
      DSN: postgres://estafeta:estafeta@postgres:5432/keto?sslmode=disable
    ports:
      - "4466:4466"   # read
      - "4467:4467"   # write
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  natsdata:
